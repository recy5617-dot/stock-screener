name: 每日收盤後選股

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: 取出 repo 內容
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行選股
        run: python main.py

      - name: 把今天的結果存回 repo
        run: |
          git config user.name "stock-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output cache
          git diff --quiet --cached || git commit -m "選股結果 $(date -u +'%Y-%m-%d')"
          git push
