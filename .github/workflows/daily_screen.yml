name: 每日收盤後選股

on:
  schedule:
    # 台灣時間週一到週五 晚上7:30（UTC+8）＝ UTC 11:30
    # 特意排在較晚時間，讓 TWSE 三大法人／融資融券資料當天都已公告齊全
    - cron: "30 11 * * 1-5"
  workflow_dispatch:      # 讓你可以在 GitHub 網頁上手動點一下立刻執行，方便測試
    inputs:
      date:
        description: "指定日期 YYYY-MM-DD（留空=用今天，週末/假日想測試時可以填最近的交易日）"
        required: false
        default: ""
      mode:
        description: "要跑哪一種選股"
        required: false
        type: choice
        default: "兩種都跑"
        options:
          - "兩種都跑"
          - "只跑當沖"
          - "只跑波段(原本的選股)"

permissions:
  contents: write   # 需要這個權限，工作完成後才能把結果 commit 回這個 repo

jobs:
  screen:
    runs-on: ubuntu-latest
    steps:
      - name: 取出 repo 內容
        uses: actions/checkout@v5

      - name: 安裝 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行選股
        env:
          INPUT_DATE: ${{ github.event.inputs.date }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          # 排程自動執行時沒有 inputs，INPUT_MODE 是空的 -> 兩種都跑
          args=()
          if [ -n "$INPUT_DATE" ]; then
            args+=(--date "$INPUT_DATE")
          fi
          case "$INPUT_MODE" in
            "只跑當沖") args+=(--daytrade-only) ;;
            "只跑波段(原本的選股)") args+=(--no-daytrade) ;;
          esac
          python main.py "${args[@]}"

      - name: 把今天的結果存回 repo
        run: |
          git config user.name "stock-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output cache docs
          git diff --quiet --cached || git commit -m "選股結果 $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash origin main
          git push
